/* конец блока, адаптивность */
function evaluate(id,level,correct,total,sec){
  const m=MODS[id],min=needFor(id,level,sec||120),acc=total?correct/total:0;
  if(total>=min&&acc>=0.9&&level<m.levels.length) return level+1;
  if(total>=Math.ceil(min/2)&&acc<0.4&&level>1) return level-1;
  return level;
}

function finishBlock(){
  if(!blk) return;
  clearInterval(timerId); gen++;
  const newLevel=blk.fixed?blk.level:evaluate(blk.id,blk.level,blk.correct,blk.total,blk.sec);
  const avg=blk.times.length?Math.round(blk.times.reduce((a,b)=>a+b,0)/blk.times.length):0;
  const rec={t:Date.now(),mod:blk.id,level:blk.level,newLevel,correct:blk.correct,total:blk.total,avgMs:avg,sec:blk.sec,maxCombo:blk.maxCombo,need:blk.id==='daily'?0:needFor(blk.id,blk.level,blk.sec)};
  const rankBefore=rankInfo().idx;
  if(!blk.fixed) S.levels[blk.id]=newLevel;
  if(blk.id==='daily'){ S.daily=S.daily||{}; const k=run.dayKey||isoDay(); if(!S.daily[k]) S.daily[k]={correct:blk.correct,total:blk.total,ms:Date.now()-blk.start,marks:blk.marks.slice()}; run.dailyFirst=!run.dailyRepeat; }
  S.blocks.push(rec); if(S.blocks.length>3000) S.blocks.splice(0,S.blocks.length-3000);
  run.results.push(rec);
  blk=null; task=null; run.idx++;
  save(); syncNative();
  const rankAfter=rankInfo().idx, last=run.idx>=run.queue.length;
  const next=()=>{ if(!last) showIntro(); else showSummary(); };
  const cont=rankAfter>rankBefore?()=>showRankUp(rankAfter,next):next;
  if(newLevel>rec.level) showLevelUp(rec,cont);
  else { if(!last) sfx('block'); cont(); }
}


/* песчаная буря поверх экрана */
function sandstorm(){
  if(reduced()) return;
  const cv=document.createElement('canvas'); cv.className='storm';
  const W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; document.body.appendChild(cv);
  const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--dune1','--dune2','--spice','--ink'].map(x=>cs.getPropertyValue(x).trim()||'#c96');
  const fog=cs.getPropertyValue('--dune2').trim()||'#a86';
  const P=Array.from({length:520},()=>({x:Math.random()*W*1.6-W*.8,y:Math.random()*H,v:6+Math.random()*16,l:4+Math.random()*16,w:.8+Math.random()*1.8,c:cols[Math.floor(Math.random()*cols.length)],a:.35+Math.random()*.6}));
  const T=1900,t0=performance.now();
  const frame=t=>{
    const k=(t-t0)/T; if(k>=1){ cv.remove(); return; }
    const dens=k<.3?k/.3:1-(k-.3)/.7;
    c.clearRect(0,0,W,H);
    c.globalAlpha=Math.max(0,dens*.8); c.fillStyle=fog; c.fillRect(0,0,W,H);
    P.forEach(p=>{ p.x+=p.v; p.y+=p.v*.08; if(p.x>W+20){p.x=-20;p.y=Math.random()*H;}
      c.globalAlpha=p.a*Math.max(.1,dens); c.strokeStyle=p.c; c.lineWidth=p.w; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.l,p.y-p.l*.08); c.stroke(); });
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

const isoDay=(t)=>{const d=t?new Date(t):new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function dailyTasks(key){
  const r=seeded('numen-'+key), R=(a,b)=>a+Math.floor(r()*(b-a+1)), T=[];
  let x=R(100,999),y=R(100,999); T.push({type:'calc',q:`${fmt(x)} + ${fmt(y)}`,a:x+y});
  x=R(500,999); y=R(101,x-1); T.push({type:'calc',q:`${fmt(x)} − ${fmt(y)}`,a:x-y});
  x=R(12,99); y=R(3,9); T.push({type:'calc',q:`${x} × ${y}`,a:x*y});
  y=R(101,899); T.push({type:'calc',q:`1 000 − ${y}`,a:1000-y});
  x=R(1,9)*10+5; T.push({type:'calc',q:`${x}²`,a:x*x});
  const a3=[R(11,99),R(11,99),R(11,99)]; T.push({type:'calc',q:a3.join(' + '),a:a3[0]+a3[1]+a3[2]});
  const pc=[10,15,20,25,30,40,50,75][R(0,7)], b=R(4,40)*20; T.push({type:'calc',q:`${pc}% от ${fmt(b)}`,a:pc*b/100});
  x=R(11,50); y=R(11,50); T.push({type:'calc',q:`${x} × ${y}`,a:x*y});
  const yy=R(1950,2049), mo=R(0,11), d=R(1,new Date(Date.UTC(yy,mo+1,0)).getUTCDate()); T.push({type:'dow',y:yy,mo,d});
  x=R(12,99); y=R(12,99); T.push({type:'calc',q:`${x} × ${y}`,a:x*y});
  return T;
}

};
function remindAskHTML(){
  if(S.remindAsked||S.settings.remind||!hasNative('setReminder')||!S.blocks.length) return '';
  return `<section class="daily"><div class="dtop"><span class="glyph">🔔</span><div class="t"><b>Напоминать о тренировке?</b><span class="muted small">Одно уведомление в день, только если ты ещё не занимался. Время можно поменять в настройках.</span></div></div>
    <div class="chips"><button class="pill" data-a="remyes">Да, в 19:00</button><button class="ghost" data-a="remno">Не надо</button></div></section>`;
}

/* ---------- приветствие ---------- */
const WSLIDES=[
  ()=>`<h1>Привет, будущий нумен</h1><p>Счёт, память и внимание. По 15 минут в день.</p>`,
  ()=>`<h1>Решай на время</h1><p>Верно — пример сдувает, и сразу следующий.</p>`,
  ()=>`<h1>Иди по пути</h1><p>${STAGES.length} ступеней. Звёзды за точность, сложность растёт сама.</p>`,
  ()=>`<h1>Каждый день — огонёк</h1><p>Тренируйся каждый день, и серия растёт. Пропустишь — сгорит.</p>`
];
const WART=[null,
  ()=>`<div class="wanim"><div class="wcard"><div class="wq">47 × 8</div><div class="wa"><span>3</span><span>7</span><span>6</span></div><div class="wok">Верно!</div>${'<i></i>'.repeat(14)}</div></div>`,
  ()=>`<div class="wanim"><div class="wpath">${[0,1,2,3].map(i=>`<div class="wn n${i}" style="--i:${i}"><b>${['+−','×','07','◈'][i]}</b><span>★★★</span></div>`).join('')}</div></div>`,
  ()=>`<div class="wanim"><div class="wweek">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<div style="--i:${i}"><i>${DROP}</i><span>${d}</span></div>`).join('')}</div><div class="wstreak">Серия: <b class="wnum"></b></div></div>`];
let wIdx=0;
function showWelcome(){
  wIdx=0; document.body.classList.add('welcoming'); let d=$('#welcome'); if(!d){ d=document.createElement('div'); d.id='welcome'; d.className='welcome'; document.body.appendChild(d); }
  drawWelcome();
}
function drawWelcome(){
  const d=$('#welcome'); if(!d) return; const last=wIdx===WSLIDES.length-1;
  d.innerHTML=`<div class="art hero" style="${skyStyle()}">${DUNES('wsky')}${WART[wIdx]?WART[wIdx]():''}</div>
    <div class="body">${WSLIDES[wIdx]()}</div>
    <div class="foot"><div class="wdots">${WSLIDES.map((_,i)=>`<i class="${i===wIdx?'on':''}"></i>`).join('')}</div>
      ${last?`<button class="primary" data-w="tour">Покажи, что где</button><button class="ghost" data-w="done">Сразу к пути</button>`
            :`<button class="primary" data-w="next">Дальше</button><button class="ghost" data-w="done">Пропустить</button>`}</div>`;
}
function endWelcome(go){
  const d=$('#welcome'); if(d) d.remove(); document.body.classList.remove('welcoming');
  S.onboarded=true; save();
  if(go==='tour'){ tab='home'; render(); setTimeout(startTour,250); }
  else { tab='path'; render(); }
}

/* ---------- экскурсия ---------- */
const TOUR=[
  {sel:'[data-a=start]',t:'Тренировка дня',d:'Жми — и вперёд. Сложность подстроится сама.'},
  {sel:'.tabs [data-tab=path]',t:'Путь',d:'Ступени и звёзды. Начни отсюда.'},
  {sel:'.tabs [data-tab=theory]',t:'Теория',d:'Как решать — с анимацией.'},
  {sel:'.tabs [data-tab=prog]',t:'Прогресс',d:'Графики, рекорды, ранги.'},
  {sel:'.tabs [data-tab=settings]',t:'Настройки',d:'Палитра, звуки, напоминания.'}];
let tIdx=0;
function startTour(){ tab='home'; render(); tIdx=0; let d=$('#tour'); if(!d){ d=document.createElement('div'); d.id='tour'; d.className='tour'; d.innerHTML='<div class="spot"></div><div class="tip"></div>'; document.body.appendChild(d);} drawTour(); }
function drawTour(){
  const d=$('#tour'); if(!d) return;
  while(tIdx<TOUR.length&&!document.querySelector(TOUR[tIdx].sel)) tIdx++;
  if(tIdx>=TOUR.length){ endTour(); return; }
  const step=TOUR[tIdx], el=document.querySelector(step.sel);
  if(!el.closest('.tabs')) el.scrollIntoView({block:'center'});
  setTimeout(()=>{
    const r=el.getBoundingClientRect(), pad=6, sp=d.querySelector('.spot'), tip=d.querySelector('.tip');
    Object.assign(sp.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    const last=tIdx===TOUR.length-1;
    tip.innerHTML=`<div class="tstep">${tIdx+1}</div><b>${step.t}</b><p>${step.d}</p><div class="row"><button class="ghost" data-tour="skip">${last?'':'Пропустить'}</button><span class="muted small">${tIdx+1} из ${TOUR.length}</span><button class="primary" data-tour="next">${last?'Готово':'Дальше'}</button></div>`;
    const below=r.top<innerHeight*.5;
    tip.style.top=below?(r.bottom+pad+12)+'px':''; tip.style.bottom=below?'':(innerHeight-r.top+pad+12)+'px';
  },el.closest('.tabs')?10:260);
}
function endTour(){ const d=$('#tour'); if(d) d.remove(); S.onboarded=true; save(); tab='path'; render(); }

/* кнопка «Назад» на Android */
window.mentatBack=function(){
  if($('#tour')){ endTour(); return true; }
  if($('#welcome')){ if(wIdx>0){ wIdx--; drawWelcome(); } return true; }
  if($('#sheet')){ $('#sheet').remove(); return true; }
  if(pendingCont){ const c=pendingCont; pendingCont=null; c(); return true; }
  if(blk&&!blk.paused){ pauseBlock(); return true; }
  if(run){
    const q=document.querySelector('[data-a="quit"]');
    if(q){ quit(q); return true; }
    run=null; render(); return true;
  }
  if(tab==='theory'&&openArt){ openArt=null; render(); return true; }
  if(tab!=='home'){ tab='home'; render(); return true; }
  return false;
};

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  if(!AMB&&S.settings.ambient) startAmbient();
  const ds=e.target.closest('.dstage'); if(ds){ const el=ds.closest('.demo'); if(el){ const i=+el.dataset.i||0, n=DEMOS[el.dataset.demo].length; tapSound('btn'); playDemo(el,i+1<n?i+1:0); } return; }
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  tapSound(d.tab?'tab':'btn'); if(d.tab) buzz(12);
  const pe=d.tab?t.querySelector('svg'):t; if(pe&&!reduced()){ pe.classList.remove('press'); void pe.getBoundingClientRect(); pe.classList.add('press'); }
  if(d.w){ if(d.w==='next'){ wIdx++; drawWelcome(); } else endWelcome(d.w); return; }
  if(d.tour){ if(d.tour==='next'&&tIdx<TOUR.length-1){ tIdx++; drawTour(); } else endTour(); return; }
  if(d.stage!==undefined){ if(run){ run=null; } tab='path'; if(!$('#sheet')) render(); const sh=$('#sheet'); if(sh) sh.remove(); stageSheet(+d.stage); return; }
  if(d.startStage!==undefined){ const i=+d.startStage, sh=$('#sheet'); if(sh) sh.remove(); pendingCont=null; startSession(STAGES[i].blocks,'path'); run.stage=i; return; }
  if(d.tab){ if(d.tab==='settings') prevTab=tab; tab=d.tab; if(tab!=='mods') openSkill=null; if(tab!=='theory') openArt=null; render(); return; }
  if(d.art){ tab='theory'; openArt=d.art; render(); return; }
  if(d.themeSet){ S.settings.theme=d.themeSet; save(); applyLook(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.accent){ S.settings.accent=d.accent; save(); applyLook(); restartAmbient(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.k!==undefined){ press(d.k); return; }
  if(d.dow!==undefined){ answerDow(d.dow==='skip'?-1:+d.dow); return; }
  if(d.kim!==undefined){ toggleKim(+d.kim,t); return; }
  if(d.skill){ openSkill=d.skill; render(); return; }
  if(d.pm){ progMod=d.pm; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.hear){ const was=S.settings.events; S.settings.events=true; eventSound(d.hear); S.settings.events=was; return; }
  if(d.set){ S.settings[d.set]=!S.settings[d.set]; save(); t.setAttribute('aria-checked',String(S.settings[d.set])); if(d.set==='big') applyLook(); if(d.set==='remind'){ S.remindAsked=true; save(); if(!hasNative('setReminder')) toast('Напоминания работают в приложении на телефоне'); applyReminder(); }
  if(d.set==='ambient'){ if(S.settings.ambient) startAmbient(); else stopAmbient(); } if(d.set==='sound'&&S.settings.sound) sfx('ok',0); if(d.set==='vibe') buzz(40); return; }
  if(d.dur!==undefined){ const opts=[60,120,180,300],b=S.program[+d.dur]; b.sec=opts[(opts.indexOf(b.sec)+1)%opts.length]; save(); render(); return; }
  if(d.rm!==undefined){ S.program.splice(+d.rm,1); save(); render(); return; }
  if(d.lv){ const max=MODS[d.lv].levels.length; S.levels[d.lv]=Math.min(max,Math.max(1,lv(d.lv)+(+d.d))); save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.train){ pendingCont=null; startSession([{id:d.train,sec:+d.sec}],'single'); return; }
  switch(d.a){
    case 'add': S.program.push({id:$('#addsel').value,sec:120}); save(); render(); break;
    case 'start': if(S.program.length) startSession(S.program,'session'); break;
    case 'go': startBlock(); break;
    case 'quit': quit(t); break;
    case 'pause': pauseBlock(); break;
    case 'resume': resumeBlock(); break;
    case 'studied': studied(); break;
    case 'kimdone': kimDone(); break;
    case 'cont': { const c=pendingCont; pendingCont=null; if(c) c(); } break;
    case 'back': openSkill=null; render(); break;
    case 'artback': openArt=null; render(); break;
    case 'setback': tab=prevTab||'home'; render(); break;
    case 'closesheet': { const sh=$('#sheet'); if(sh) sh.remove(); } break;
    case 'topath': run=null; tab='path'; render(); break;
    case 'tour': startTour(); break;
    case 'demoreplay': { const el=t.closest('.demo'); if(el) playDemo(el,0); } break;
    case 'demonext': { const el=t.closest('.demo'); if(el){ const i=+el.dataset.i||0, n=DEMOS[el.dataset.demo].length; playDemo(el,i+1<n?i+1:0); } } break;
    case 'showdemo': { const sl=$('#demoslot'); if(sl){ sl.innerHTML=demoHTML(d.id,true); t.remove(); runDemos(); } } break;
    case 'daily': startDaily(); break;
    case 'sharedaily': shareDaily(); break;
    case 'remyes': S.remindAsked=true; S.settings.remind=true; S.settings.remTime=S.settings.remTime||'19:00'; save(); applyReminder(); render(); break;
    case 'remno': S.remindAsked=true; save(); render(); break;
    case 'remtest': if(hasNative('testReminder')){ if(hasNative('canNotify')&&!MentatNative.canNotify()){ S.settings.remind=true; save(); applyReminder(); } else MentatNative.testReminder(); } else toast('Уведомления работают в приложении на телефоне'); break;
    case 'backup': doBackup(); break;
    case 'restore': doRestore(); break;
    case 'restoreok': applyRestore(); break;
    case 'welcome': showWelcome(); break;
    case 'daynight': S.settings.theme=isDark()?'light':'dark'; save(); applyLook(); render(); break;
    case 'home': run=null; render(); break;
    case 'reset': if(armed(t,'Нажми ещё раз: всё будет удалено')){ S=defState(); save(); render(); } break;
  }
});

document.addEventListener('change',e=>{ if(e.target.id==='remtime'&&e.target.value){ S.settings.remTime=e.target.value; save(); applyReminder(); if(S.settings.remind) toast(`Напомню в ${S.settings.remTime}`); } });
document.addEventListener('input',e=>{ if(e.target.id==='ambvol'){ S.settings.ambVol=+e.target.value; save(); if(!AMB&&S.settings.ambient) startAmbient(); setAmbientLevel(.2); } });

document.addEventListener('keydown',e=>{
  if(!task||!blk||blk.paused) return;
  const k=modOf(blk.id).kind;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('back');
  else if(e.key==='Enter'){ if(task.phase==='study') studied(); else if(k==='kim') kimDone(); else press('ok'); }
  else if((e.key===','||e.key==='.')&&k==='approx') press(',');
  else return;
  e.preventDefault();
});

load();
if(!S.onboarded) showWelcome();
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='appassets.androidplatform.net'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
syncNative(); applyReminder();
</script>
</body>
</html>
