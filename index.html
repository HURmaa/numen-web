<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Numen">
<meta name="theme-color" content="#14101C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EADBC0" media="(prefers-color-scheme: light)">
<title>Нумен</title>
<style>
@font-face{font-family:"Unbounded";src:url("fonts/Unbounded.ttf") format("truetype");font-weight:200 900;font-display:swap}
@font-face{font-family:"Golos Text";src:url("fonts/GolosText.ttf") format("truetype");font-weight:400 900;font-display:swap}
/* Пустыня днём и ночью: песок и охра, ночное небо с двумя лунами. Широкий гротеск для чисел и заголовков. */
:root{
  --bg:#EADBC0; --surface:#F5EBD8; --raised:#FBF4E8; --ink:#2B1C10; --muted:#7B6249; --line:#D6C19D;
  --spice:#C25A12; --spice-ink:#FFF6EA; --spice-deep:#8A3E0A; --blue:#2F55B8; --good:#2E7D4F; --bad:#B8321E;
  --key:#FBF4E8; --key-press:#E6D6B8;
  --sky1:#F4DDB0; --sky2:#EBC48A; --moon:#FFF8EA; --dune1:#DDB27A; --dune2:#CC9257; --dune3:#B5743F; --ripple:#E9C08A; --sun-op:1; --moon-op:0; --star-op:0;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101C; --surface:#1E1729; --raised:#261E33; --ink:#F2E5CD; --muted:#A8957E; --line:#362C44;
    --spice:#EE8A3C; --spice-ink:#1A1008; --spice-deep:#A4561C; --blue:#86A6FF; --good:#5CCB8F; --bad:#FF6E5A;
    --key:#251D31; --key-press:#3A2F4B;
    --sky1:#2B2244; --sky2:#191325; --moon:#F2E5CD; --dune1:#40303F; --dune2:#2F2233; --dune3:#211827; --ripple:#4A3848; --sun-op:0; --moon-op:1; --star-op:1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14101C; --surface:#1E1729; --raised:#261E33; --ink:#F2E5CD; --muted:#A8957E; --line:#362C44;
  --spice:#EE8A3C; --spice-ink:#1A1008; --spice-deep:#A4561C; --blue:#86A6FF; --good:#5CCB8F; --bad:#FF6E5A;
  --key:#251D31; --key-press:#3A2F4B;
  --sky1:#2B2244; --sky2:#191325; --moon:#F2E5CD; --dune1:#40303F; --dune2:#2F2233; --dune3:#211827; --ripple:#4A3848; --sun-op:0; --moon-op:1; --star-op:1;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--spice);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top,0px) 18px calc(96px + env(safe-area-inset-bottom))}
body.running .app{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.page{padding-top:22px}

h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--muted);margin:28px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;max-width:173px;padding:9px 0 11px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--spice)}
body.running .tabs{display:none}

.primary{display:block;width:100%;background:var(--spice);color:var(--spice-ink);border-radius:16px;padding:17px 20px;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.02em;box-shadow:0 4px 0 var(--spice-deep)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--spice-deep)}
.ghost{color:var(--muted);padding:12px 4px;font-size:15px}
.pill{border:1.5px solid var(--spice);color:var(--spice);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;font-weight:500}
.pill:active{background:var(--key-press)}

/* герой с дюнами */
.hero{position:relative;margin:calc(-1 * env(safe-area-inset-top,0px)) -18px 0;padding-top:env(safe-area-inset-top,0px);min-height:232px;overflow:hidden}
.hero svg.land{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:24px 22px 30px;display:flex;flex-direction:column;gap:5px}
.hero .date{font-size:14px;color:var(--muted)}
.rank{font-family:var(--display);font-weight:600;font-size:clamp(22px,7.4vw,32px);min-width:0;line-height:1.05;margin-top:4px}
.rankbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;max-width:230px;margin-top:8px}
.rankbar i{display:block;height:100%;background:var(--spice);border-radius:4px}
.ranknote{font-size:13px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-top:10px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;width:max-content}
.streak svg{width:16px;height:16px;fill:var(--spice)}
@media (prefers-reduced-motion: no-preference){
  .hero .d1{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
  .hero .d2{animation:rise 1.2s .12s cubic-bezier(.2,.7,.2,1) both}
  .hero .d3{animation:rise 1.2s .24s cubic-bezier(.2,.7,.2,1) both}

}
@keyframes rise{from{transform:translateY(40px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.glyph{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;color:var(--spice);background:var(--surface);border:1.5px solid var(--line)}

.plan{list-style:none}
.plan li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pname{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.pname b{display:block;font-weight:600}
.pname small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.dur{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;white-space:nowrap}
.rm{width:30px;height:32px;color:var(--muted);font-size:22px;line-height:1}
.addrow{display:flex;gap:8px;margin:14px 0 22px}
select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.addrow button{border:1px solid var(--line);border-radius:12px;padding:11px 14px;white-space:nowrap}
.note{margin-top:16px;font-size:13.5px;color:var(--muted);line-height:1.5}
.weak{list-style:none}
.weak li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.weak .t{flex:1;min-width:0}
.weak small{display:block;color:var(--muted);font-size:13px}

/* навыки */
.skill{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.skill .t{flex:1;min-width:0}
.skill b{font-weight:600}
.segs{display:flex;gap:3px;margin-top:7px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--spice)}
.skill .lv{font-size:13px;color:var(--muted);white-space:nowrap}
.basics{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:16px 0 6px;width:100%;text-align:left}
.basics svg{width:44px;height:44px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);padding:6px 0;font-size:15px}
.dhead{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.dhead .glyph{width:54px;height:54px;font-size:19px;border-radius:15px}
.lvbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.lvtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvctl{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-weight:600}
.lvctl button{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;font-size:18px;background:var(--raised)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}

/* теория */
.theory{line-height:1.6;-webkit-user-select:text;user-select:text}
.theory p{margin:10px 0;max-width:62ch}
.theory .lead{font-size:17px}
.theory ol,.theory ul{padding-left:22px;margin:8px 0}
.theory li{margin:6px 0}
.theory ol li::marker{color:var(--spice);font-family:var(--display);font-weight:600}
.theory ul li::marker{color:var(--spice)}
.ex{border-left:3px solid var(--spice);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 14px;margin:10px 0}
.exq{font-family:var(--display);font-weight:500;font-size:16px}
.exa{color:var(--muted);font-size:15px;margin-top:4px}

/* тренировка */
.run{display:flex;flex-direction:column;min-height:100dvh;padding-top:14px}
.runhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.runtitle{text-align:center;flex:1;font-family:var(--display);font-weight:500;font-size:15px}
.runtitle span{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.score{min-width:64px;text-align:right;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;position:relative}
.timer{height:10px;background:var(--line);border-radius:5px;margin:14px 0 6px;overflow:hidden}
#tbar{height:100%;border-radius:5px;transform-origin:left center;background:var(--spice);background-image:repeating-linear-gradient(115deg,transparent 0 6px,rgba(255,255,255,.18) 6px 8px)}
.tleft{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:24px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.combo{font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--spice-ink);background:var(--spice);border-radius:999px;padding:3px 10px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:none}
.combo.bump{animation:bump .35s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:16px 0}
.q{font-family:var(--display);font-weight:400;font-size:clamp(32px,10vw,54px);font-variant-numeric:tabular-nums;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.q.small{font-size:19px;font-weight:500}
.q.dateq{font-size:clamp(25px,8vw,40px)}
.q.flash{min-height:1.15em;font-size:clamp(68px,23vw,116px);color:var(--spice);font-weight:500}
.ans{min-width:62%;font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums;border-bottom:3px solid var(--ink);padding:2px 8px;min-height:54px;transition:color .15s,border-color .15s}
.ans.dig{font-size:24px;word-spacing:.25em}
.ans.empty{color:var(--muted)}
.ans.ok{border-color:var(--good);color:var(--good)}
.ans.no{border-color:var(--bad);color:var(--bad)}
.fb{font-family:var(--display);font-size:16px;font-weight:600;min-height:26px}
.fb.ok{color:var(--good)}
.fb.no{color:var(--bad)}
.hint{color:var(--muted);font-size:14px;max-width:34ch}
.controls{padding-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--key);border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;height:58px;font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums}
.pad button:active,.dows button:active{background:var(--key-press);transform:translateY(2px)}
.pad .okk{background:var(--spice);color:var(--spice-ink);border-color:var(--spice-deep)}
.pad .skip{grid-column:span 2;font-family:var(--body);font-size:15px;color:var(--muted);height:46px}
.pad .skip.wide3{grid-column:span 3}
.pad [data-k=","]{height:46px}
.dows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dows button{background:var(--key);border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;height:60px;font-family:var(--display);font-size:16px;font-weight:500}
.dows .skipd{font-family:var(--body);font-size:14px;color:var(--muted)}
.dows button.right{border-color:var(--good);color:var(--good)}
.dows button.wrongb{border-color:var(--bad);color:var(--bad)}
.digits{font-family:var(--display);font-weight:400;font-size:clamp(25px,8vw,38px);word-spacing:.35em;line-height:1.5;max-width:11em;font-variant-numeric:tabular-nums}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.kgrid span,.kgrid button{font-size:32px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kgrid.dense span,.kgrid.dense button{font-size:23px;border-radius:10px}
.kgrid button[aria-pressed="true"]{border:2px solid var(--spice);background:var(--key-press)}
.kgrid button.was{box-shadow:inset 0 0 0 3px var(--good)}
.kgrid button.wrong{box-shadow:inset 0 0 0 3px var(--bad)}

/* анимации ответа */
.grain{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;background:var(--spice);opacity:0}
.grain.g2{background:var(--good)}
.grain.g3{background:var(--blue);width:5px;height:5px}
.plus{position:absolute;right:0;top:-6px;color:var(--good);font-family:var(--display);font-weight:700;font-size:15px;pointer-events:none;opacity:0}
@media (prefers-reduced-motion: no-preference){
  .grain{animation:fly .75s cubic-bezier(.15,.7,.3,1) forwards}
  .plus{animation:floatup .8s ease-out forwards}
  .fb.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  .shake{animation:shake .42s}
  .ans.ok{animation:glow .6s}
}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
@keyframes floatup{0%{transform:none;opacity:1}100%{transform:translateY(-34px);opacity:0}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes glow{0%{transform:scale(1.06)}100%{transform:none}}

/* между блоками и итоги */
.interlude{min-height:calc(100dvh - 20px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.step{color:var(--spice);font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.04em}
.lastres{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvlabel{color:var(--muted)}
.tip{line-height:1.55;color:var(--muted);font-size:15px}
.interlude .primary{margin-top:14px}
.up{color:var(--good);font-weight:600}
.down{color:var(--bad);font-weight:600}
.stars{display:inline-flex;gap:2px;flex:none}
.stars svg{width:17px;height:17px}
.stars.big{gap:10px;justify-content:center;margin:12px 0 6px}
.stars.big svg{width:52px;height:52px}
.stars .s1{fill:var(--spice)}
.stars .s0{fill:var(--line)}
@media (prefers-reduced-motion: no-preference){ .stars.big svg{animation:starin .5s cubic-bezier(.2,1.6,.4,1) both} .stars.big svg:nth-child(2){animation-delay:.18s} .stars.big svg:nth-child(3){animation-delay:.36s} }
@keyframes starin{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.summary{padding-top:28px;text-align:center}
.summary h1{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 14px}
.kpis div{font-family:var(--display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:14px;padding:12px 4px}
.kpis small{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:2px}
.res{list-style:none;margin-bottom:22px;text-align:left}
.res li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.res small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.rnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.again{margin-top:8px;font-size:13px;padding:5px 12px}
.summary .ghost{display:block;width:100%;margin-top:6px}

/* новый уровень */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.rings{position:relative;width:190px;height:190px;display:grid;place-items:center;margin-bottom:10px}
.rings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--spice);opacity:.3}
.rings b{font-family:var(--display);font-weight:600;font-size:76px;color:var(--spice);position:relative}
.overlay .primary{max-width:320px;margin-top:20px}
@media (prefers-reduced-motion: no-preference){
  .rings i{animation:ring 2.4s ease-out infinite}
  .rings i:nth-child(2){animation-delay:.8s}
  .rings i:nth-child(3){animation-delay:1.6s}
  .rings b{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
}
@keyframes ring{from{transform:scale(.45);opacity:.9}to{transform:scale(1.15);opacity:0}}

/* статистика */
.kpis4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpis4 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--display);font-weight:500;font-size:clamp(15px,4.6vw,20px);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none}
.kpis4 small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-top:12px}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.card .ct b{font-weight:600}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:10.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .sA{stroke:var(--spice);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .aA{fill:var(--spice);opacity:.14}
.chart .sB{stroke:var(--blue);stroke-width:2;fill:none;stroke-linejoin:round}
.chart .sC{stroke:var(--good);stroke-width:2;fill:none;stroke-linejoin:round}
.chart .dA{fill:var(--spice)}
.chart .dB{fill:var(--blue)}
.chart .dC{fill:var(--good)}
.chart .bar{fill:var(--spice)}
.chart .bar0{fill:var(--line)}
.chart .radar{fill:var(--spice);fill-opacity:.25;stroke:var(--spice);stroke-width:2;stroke-linejoin:round}
.chart .rgrid{fill:none;stroke:var(--line)}

.dq.big{font-size:clamp(34px,11vw,52px)}
.dr{font-family:var(--display);font-size:clamp(18px,5.4vw,24px);color:var(--muted);font-variant-numeric:tabular-nums}
.demo .h1{background:var(--spice);color:var(--spice-ink);border-radius:8px;padding:0 6px;font-weight:600}
.demo .h2{color:var(--good);font-weight:700}
.dnote{text-align:center;font-weight:600;min-height:22px;margin-top:6px}
.dctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ddots{display:flex;gap:4px}
.ddots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}
.ddots i.on{background:var(--spice)}
.dbtn{color:var(--muted);font-size:14px;padding:6px 4px}
.cols{display:flex;gap:18px;font-family:var(--display);font-size:clamp(30px,9vw,42px)}
.cols div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.cols small{font-family:var(--body);font-size:12px;color:var(--muted);min-height:16px}
.cols .ghost{color:var(--line)}
.mg{position:relative;display:grid;grid-template-columns:auto;justify-items:center;font-family:var(--display);font-size:clamp(34px,10vw,46px);line-height:1.1}
.mg>div{display:flex;gap:14px}
.mg .x{font-size:20px;color:var(--muted)}
.mg span{padding:0 6px;border-radius:10px;transition:background .3s,color .3s}
.mg span.on{background:var(--spice);color:var(--spice-ink)}
.mgx{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mgx line{stroke:var(--spice);stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:4 4;opacity:.8}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel{width:170px;height:170px}
.wheel .wr{fill:none;stroke:var(--line);stroke-width:2}
.wheel .wd{fill:var(--raised);stroke:var(--line);stroke-width:1.5;transition:fill .3s}
.wheel .wd.on{fill:var(--spice);stroke:var(--spice)}
.wheel .wt{font-family:var(--body);font-size:11px;font-weight:600;text-anchor:middle;fill:var(--ink);pointer-events:none}
.wheel .hand{transform-origin:80px 80px}
.wheel .hand line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.wheel .hand circle{fill:var(--ink)}
.wsub{font-weight:600;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chiprow span{font-family:var(--display);padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised)}
.chiprow span.on{background:var(--spice);color:var(--spice-ink);border-color:var(--spice)}
.flashd{font-family:var(--display);font-size:72px;color:var(--spice);line-height:1}
.emo{font-size:46px;line-height:1}
.emo4{font-size:34px;letter-spacing:.08em}
.emo4 .pk{outline:3px solid var(--good);border-radius:10px}
.rooms{display:flex;gap:12px}
.rooms div{display:flex;flex-direction:column;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:26px}
.rooms small{font-size:12px;color:var(--muted)}
.rooms b{font-size:30px}
.short{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:6px 0 12px;padding:0}
.short li{counter-increment:s;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:500}
.short li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:7px;background:var(--spice);color:var(--spice-ink);display:grid;place-items:center;font-family:var(--display);font-size:13px}
.interlude .short{margin:2px 0 4px}
.interlude .demo{margin:4px 0}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:600;color:var(--spice);padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾"}
details.more[open] summary::after{content:" ▴"}

/* приветствие: живые картинки */
.welcome .art{position:relative}
.wanim{position:absolute;inset:0;display:grid;place-items:center;padding-top:env(safe-area-inset-top,0px)}
.wcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 26px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:190px}
.wq{font-family:var(--display);font-size:34px}
.wa{font-family:var(--display);font-size:32px;color:var(--good);border-bottom:3px solid var(--good);min-height:44px;margin-top:4px}
.wa span{opacity:0}
.wok{font-family:var(--display);font-weight:600;color:var(--good);margin-top:6px;opacity:0}
.wcard i{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--spice);opacity:0}
.wpath{display:flex;gap:16px;align-items:flex-end}
.wn{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateY(calc(var(--i) * -10px))}
.wn b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--display);color:var(--muted)}
.wn span{color:var(--spice);font-size:13px;letter-spacing:2px;opacity:0}
.wweek{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.wweek div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wweek i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--raised)}
.wweek i svg{width:14px;height:14px;fill:var(--spice-ink);opacity:0}
.wstreak{position:absolute;bottom:18%;font-family:var(--display);font-weight:600;background:var(--surface);border-radius:999px;padding:6px 14px}
.wnum::after{content:"0";animation:wnum 6s steps(1) infinite}
@keyframes wnum{0%{content:"0"}14%{content:"1"}24%{content:"2"}34%{content:"3"}44%{content:"4"}54%{content:"5"}64%{content:"6"}74%{content:"7"}}
@media (prefers-reduced-motion: no-preference){
  .wa span{animation:wtype 4s infinite}
  .wa span:nth-child(2){animation-delay:.25s}.wa span:nth-child(3){animation-delay:.5s}
  .wok{animation:wok 4s infinite}
  .wq,.wa{animation:wblow 4s infinite}
  .wcard i{animation:wgrain 4s infinite}
  .wn b{animation:wnode 5s infinite;animation-delay:calc(var(--i) * .7s)}
  .wn span{animation:wstar 5s infinite;animation-delay:calc(var(--i) * .7s + .3s)}
  .wweek i{animation:wday 6s infinite;animation-delay:calc(var(--i) * .6s)}
  .wweek i svg{animation:wdrop 6s infinite;animation-delay:calc(var(--i) * .6s)}
}
@keyframes wtype{0%,8%{opacity:0}12%,100%{opacity:1}}
@keyframes wok{0%,30%{opacity:0;transform:scale(.6)}36%,62%{opacity:1;transform:none}70%,100%{opacity:0}}
@keyframes wblow{0%,60%{opacity:1;transform:none;filter:none}78%,92%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:none}}
@keyframes wgrain{0%,60%{opacity:0;transform:translate(-50%,-50%)}62%{opacity:1}85%,100%{opacity:0;transform:translate(calc(-50% + 90px),calc(-50% - 20px))}}
@keyframes wnode{0%,10%{background:var(--surface);color:var(--muted);border-color:var(--line)}16%,90%{background:var(--spice);color:var(--spice-ink);border-color:var(--spice-deep)}100%{background:var(--surface);color:var(--muted);border-color:var(--line)}}
@keyframes wstar{0%,10%{opacity:0;transform:scale(.4)}18%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes wday{0%,6%{background:var(--raised);border-color:var(--line)}10%,88%{background:var(--spice);border-color:var(--spice)}100%{background:var(--raised);border-color:var(--line)}}
@keyframes wdrop{0%,6%{opacity:0}10%,88%{opacity:1}100%{opacity:0}}
.tour .tstep{float:right;width:30px;height:30px;border-radius:50%;background:var(--spice);color:var(--spice-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600}
</style>
</head>

<script src="theory.js"></script>
<script>
/* ---------- помощники ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const nd=d=>rnd(10**(d-1),10**d-1);
const fmt=n=>Number(n).toLocaleString('ru-RU');
const fmtDec=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const plural=(n,f)=>{const a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<10||b>=20)?f[1]:f[2];};
const groupDigits=s=>(s.match(/.{1,2}/g)||[]).join(' ');
const fmtClock=ms=>{const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;};
const sec1=ms=>(ms/1000).toFixed(1).replace('.',',');
const reduced=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOWF=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const DOWA=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const CY=new Date().getFullYear();
const ANCHOR_I=(new Date(Date.UTC(CY,3,4)).getUTCDay()+6)%7;
const EMOJI=['🍎','🔑','🕯️','📕','⌛','🧭','🗡️','💎','🪶','🎲','🔔','🧪','🪐','🌙','⭐','🍄','🐚','🦂','🐍','🦅','🌵','🏺','⚙️','🔭','🧲','🪙','🎻','🥁','🧩','🪁','📜','🛡️','🏹','🪓','🔦','🧵','🪞','🧸','🍇','🍋','🥥','🌶️','🧄','🐟','🦉','🐢','🌋','❄️','🔥','💧','🌿','🍁','🌸','🎈','✉️','📌','✂️','🔒','☂️','🎩'];

const sum=arr=>({q:arr.map(fmt).join(' + '),a:arr.reduce((s,x)=>s+x,0)});
const diff=(x,y)=>{if(y>x)[x,y]=[y,x];if(x===y)x++;return {q:`${fmt(x)} − ${fmt(y)}`,a:x-y};};
const mul=(x,y)=>({q:`${fmt(x)} × ${fmt(y)}`,a:x*y});
const sq=n=>({q:`${fmt(n)}²`,a:n*n});
const pct=tol=>{const p=rnd(3,97),b=rnd(100,999);return {q:`${p}% от ${fmt(b)}`,a:p*b/100,tol};};
const root=(lo,hi,tol)=>{const n=rnd(lo,hi);return {q:`√${fmt(n)}`,a:Math.sqrt(n),tol};};
const divv=tol=>{const x=rnd(100,9999),y=rnd(3,99);return {q:`${fmt(x)} : ${y}`,a:x/y,tol};};

/* ---------- модули ---------- */
const MODS={
  add:{name:'Сложение',short:'Слож.',glyph:'+',kind:'calc',
    tip:'Складывай слева направо: сначала старшие разряды, потом младшие. Держи в голове одно растущее число, а не столбик.',
    levels:[
      {label:'2 + 2 цифры',gen:()=>sum([nd(2),nd(2)])},
      {label:'3 + 2 цифры',gen:()=>sum([nd(3),nd(2)])},
      {label:'3 + 3 цифры',gen:()=>sum([nd(3),nd(3)])},
      {label:'Три двузначных',gen:()=>sum([nd(2),nd(2),nd(2)])},
      {label:'4 + 3 цифры',gen:()=>sum([nd(4),nd(3)])},
      {label:'Три трёхзначных',gen:()=>sum([nd(3),nd(3),nd(3)])},
      {label:'4 + 4 цифры',gen:()=>sum([nd(4),nd(4)])},
      {label:'Четыре трёхзначных',gen:()=>sum([nd(3),nd(3),nd(3),nd(3)])},
      {label:'5 + 5 цифр',gen:()=>sum([nd(5),nd(5)])}],
    min:[14,12,10,10,8,8,8,6,6]},
  sub:{name:'Вычитание',short:'Вычит.',glyph:'−',kind:'calc',
    tip:'Вычитание из круглого числа: каждую цифру дополняй до 9, а последнюю до 10. Например, 1000 − 387 = 613.',
    levels:[
      {label:'2 − 2 цифры',gen:()=>diff(nd(2),nd(2))},
      {label:'100 − число',gen:()=>diff(100,rnd(11,99))},
      {label:'3 − 2 цифры',gen:()=>diff(nd(3),nd(2))},
      {label:'3 − 3 цифры',gen:()=>diff(nd(3),nd(3))},
      {label:'1000 − число',gen:()=>diff(1000,rnd(101,999))},
      {label:'4 − 3 цифры',gen:()=>diff(nd(4),nd(3))},
      {label:'4 − 4 цифры',gen:()=>diff(nd(4),nd(4))},
      {label:'10 000 − число',gen:()=>diff(10000,rnd(1001,9999))}],
    min:[14,14,12,10,10,8,8,8]},
  mul:{name:'Умножение',short:'Умнож.',glyph:'×',kind:'calc',
    tip:'Раскладывай на части: 47 × 8 = 40 × 8 + 7 × 8. Для двузначных помогает округление: 49 × 23 = 50 × 23 − 23.',
    levels:[
      {label:'Таблица до 9 × 9',gen:()=>mul(rnd(2,9),rnd(2,9))},
      {label:'11–19 × 2–9',gen:()=>mul(rnd(11,19),rnd(2,9))},
      {label:'До 19 × 19',gen:()=>mul(rnd(11,19),rnd(11,19))},
      {label:'2 цифры × 1',gen:()=>mul(nd(2),rnd(2,9))},
      {label:'3 цифры × 1',gen:()=>mul(nd(3),rnd(2,9))},
      {label:'2 × 2 цифры, до 50',gen:()=>mul(rnd(11,50),rnd(11,50))},
      {label:'2 × 2 цифры',gen:()=>mul(nd(2),nd(2))},
      {label:'3 × 2 цифры',gen:()=>mul(nd(3),nd(2))},
      {label:'3 × 3 цифры',gen:()=>mul(nd(3),nd(3))}],
    min:[16,12,10,10,8,6,5,4,3]},
  sq:{name:'Квадраты',short:'Квадр.',glyph:'x²',kind:'calc',
    tip:'Число на 5: для 65² умножь 6 на 7 и припиши 25, получится 4225. Остальные: a² = (a − b)(a + b) + b², где b — расстояние до круглого числа.',
    levels:[
      {label:'От 2 до 20',gen:()=>sq(rnd(2,20))},
      {label:'От 21 до 50',gen:()=>sq(rnd(21,50))},
      {label:'Числа на 5 до 195',gen:()=>sq(rnd(1,19)*10+5)},
      {label:'От 51 до 100',gen:()=>sq(rnd(51,100))},
      {label:'От 101 до 200',gen:()=>sq(rnd(101,200))},
      {label:'Любые трёхзначные',gen:()=>sq(nd(3))}],
    min:[12,10,8,8,6,4]},
  approx:{name:'Прикидка',short:'Прикид.',glyph:'≈',kind:'approx',
    tip:'Ищи ближайшее удобное число и вноси поправку: √50 ≈ 7 + 1/14 ≈ 7,07. Ответ засчитывается, если он попал в допуск уровня.',
    levels:[
      {label:'Простые проценты, ±5%',gen:()=>{const p=pick([5,10,15,20,25,30,40,50,60,75]),b=rnd(2,99)*10;return {q:`${p}% от ${fmt(b)}`,a:p*b/100,tol:.05};}},
      {label:'Проценты, ±3%',gen:()=>pct(.03)},
      {label:'Корни до 1000, ±3%',gen:()=>root(10,999,.03)},
      {label:'Деление, ±3%',gen:()=>divv(.03)},
      {label:'Корни до 100 000, ±2%',gen:()=>root(1000,99999,.02)},
      {label:'Всё вперемешку, ±1%',gen:()=>pick([()=>pct(.01),()=>root(100,99999,.01),()=>divv(.01)])()}],
    min:[8,8,8,8,6,6]},
  dow:{name:'День недели',short:'Даты',glyph:'Пн',kind:'dow',
    tip:`Якорные даты (4.04, 6.06, 8.08, 10.10, 12.12, 9.05, 5.09, 11.07, 7.11, 14.03, последний день февраля) в любом году выпадают на один день недели. В ${CY} году это ${DOWF[ANCHOR_I]}. Найди якорную дату месяца и отсчитай разницу, выбрасывая полные недели. Метод для любого года описан во вкладке «Теория».`,
    levels:[
      {label:`Даты ${CY} года`,from:CY,to:CY},
      {label:'2000–2099',from:2000,to:2099},
      {label:'1900–2099',from:1900,to:2099},
      {label:'1800–2199',from:1800,to:2199},
      {label:'1600–2399',from:1600,to:2399}],
    min:[10,8,8,6,6]},
  flash:{name:'Флеш-счёт',short:'Флеш',glyph:'∑',kind:'flash',
    tip:'Числа появляются по одному. Не повторяй их про себя: сразу прибавляй к текущей сумме и держи в голове только её.',
    levels:[
      {label:'4 однозначных, 1,2 с',n:4,d:1,ms:1200},
      {label:'6 однозначных, 1 с',n:6,d:1,ms:1000},
      {label:'4 двузначных, 1,4 с',n:4,d:2,ms:1400},
      {label:'6 двузначных, 1,2 с',n:6,d:2,ms:1200},
      {label:'8 двузначных, 1 с',n:8,d:2,ms:1000},
      {label:'5 трёхзначных, 1,5 с',n:5,d:3,ms:1500},
      {label:'8 трёхзначных, 1,2 с',n:8,d:3,ms:1200},
      {label:'10 трёхзначных, 1 с',n:10,d:3,ms:1000}],
    min:[3,3,3,3,3,3,3,3]},
  recall:{name:'Память на цифры',short:'Цифры',glyph:'07',kind:'recall',
    tip:'Цифры показаны парами. Превращай каждую пару в яркий образ и расставляй образы по маршруту своего дворца памяти. Можно нажать «Запомнил» раньше времени.',
    levels:[5,6,7,8,10,12,14,16,20,24,30,40].map(n=>({label:`${n} ${plural(n,['цифра','цифры','цифр'])}`,n})),
    min:Array(12).fill(3)},
  span:{name:'Обратный ряд',short:'Обратн.',glyph:'⇄',kind:'span',
    tip:'Цифры появляются по одной, а вводить их нужно с конца. Проговаривай ряд ритмичными группами по три.',
    levels:[3,4,5,6,7,8,9,10].map(n=>({label:`${n} ${plural(n,['цифра','цифры','цифр'])}`,n})),
    min:Array(8).fill(3)},
  kim:{name:'Игра Кима',short:'Ким',glyph:'◎',kind:'kim',
    tip:'Запомни предметы, потом найди их среди лишних. Не запоминай по одному: сплетай их в короткую историю или представляй комнату, где они лежат.',
    levels:[[4,8],[5,8],[6,9],[7,9],[8,10],[10,12],[12,12]].map(([k,s])=>({label:`${k} ${plural(k,['предмет','предмета','предметов'])}, ${s} с`,k,ms:s*1000})),

/* эмблемы рангов: каждая следующая добавляет элемент */
function emblem(i){
  const P=(r,a)=>[(Math.cos(a)*r).toFixed(1),(Math.sin(a)*r).toFixed(1)];
  const ray=(a,r1,r2)=>{const p1=P(r1,a),p2=P(r2,a);return `<path class="ln" d="M${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}"/>`;};
  let g='';
  if(i>=7){ let d=''; for(let k=0;k<24;k++){const r=k%2?36:47,p=P(r,-Math.PI/2+k*Math.PI/12);d+=(k?'L':'M')+p[0]+' '+p[1];} g+=`<path class="fs" d="${d}Z"/>`; }
  g+=`<circle class="ln" r="44"/>`;
  if(i>=5) for(let k=0;k<12;k++) g+=ray(k*Math.PI/6,37,42);
  if(i>=1) g+=`<circle class="ln" r="30"/>`;
  if(i>=2) [0,1,2,3].forEach(k=>g+=ray(k*Math.PI/2,9,26));
  if(i>=4) [0,1,2,3].forEach(k=>g+=ray(Math.PI/4+k*Math.PI/2,11,22));
  if(i>=3) g+=`<path class="ln" d="M0 -17L17 0L0 17L-17 0Z"/>`;
  if(i>=6) g+=`<path class="ln" d="M-24 0Q0 -17 24 0Q0 17 -24 0Z"/>`;
  g+=`<circle class="fl" r="${i>=6?6:5}"/>`;
  return `<svg class="emb" viewBox="-50 -50 100 100" aria-hidden="true">${g}</svg>`;
}

/* ---------- звук и вибрация ---------- */
let AC=null;
function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f,t0,d,type,g){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine'; o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t); v.gain.exponentialRampToValueAtTime(g||0.12,t+0.012); v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v); v.connect(a.destination); o.start(t); o.stop(t+d+0.03);
}
const SFX={
  ok:c=>{ const a=audio(); if(a) tsnd().ok(a,a.currentTime+.005,c); },
  bad:()=>{ const a=audio(); if(a) tsnd().bad(a,a.currentTime+.005); },
  level:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.32,'triangle',.11)); },
  end:()=>{ [392,523,659].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.1)); }
};

/* ---------- звуки пустыни: всё синтезируется, без записей ---------- */
let NOISE=null;
function noiseBuf(a){ if(NOISE) return NOISE; const len=a.sampleRate*4, b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; } NOISE=b; return b; }
function env(g,t,a,peak,hold,rel){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel); }
function noiseSrc(a){ const s=a.createBufferSource(); s.buffer=noiseBuf(a); s.loop=true; return s; }
function drum(a,t,f,v){
  const o=a.createOscillator(),g=a.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f*2.4,t); o.frequency.exponentialRampToValueAtTime(f,t+.18);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.9);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+1);
  const n=noiseSrc(a),lp=a.createBiquadFilter(),ng=a.createGain(); lp.type='lowpass'; lp.frequency.value=400;
  ng.gain.setValueAtTime(v*.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+.25);
  n.connect(lp); lp.connect(ng); ng.connect(a.destination); n.start(t); n.stop(t+.3);
}
/* низкий хоровой гул: пилообразные тоны через фильтры гласной «о» */
function drone(a,t,dur,notes,v){
  const out=a.createGain(); env(out,t,1.1,v,Math.max(.1,dur-2.6),1.5); out.connect(a.destination);
  [[420,7],[820,9],[2400,12]].forEach(([fq,q],k)=>{ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fq; bp.Q.value=q;
    const gg=a.createGain(); gg.gain.value=[1,.55,.18][k]; bp.connect(gg); gg.connect(out);
    notes.forEach((f,i)=>{ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=(i%2?7:-7); o.connect(bp); o.start(t); o.stop(t+dur+.2); }); });
}
function whoosh(a,t,v){
  const n=noiseSrc(a),bp=a.createBiquadFilter(),g=a.createGain(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(250,t); bp.frequency.exponentialRampToValueAtTime(2200,t+.8); bp.frequency.exponentialRampToValueAtTime(350,t+1.9);
  env(g,t,.5,v,.4,1); n.connect(bp); bp.connect(g); g.connect(a.destination); n.start(t); n.stop(t+2.2);
}
function quake(a,t){
  const n=noiseSrc(a),lp=a.createBiquadFilter(),g=a.createGain(); lp.type='lowpass'; lp.frequency.setValueAtTime(60,t); lp.frequency.linearRampToValueAtTime(180,t+2.2); lp.frequency.linearRampToValueAtTime(70,t+4);
  env(g,t,2.2,.9,.4,1.6);
  const trem=a.createOscillator(),tg=a.createGain(); trem.frequency.value=7; tg.gain.value=.35; trem.connect(tg); tg.connect(g.gain);
  n.connect(lp); lp.connect(g); g.connect(a.destination); n.start(t); n.stop(t+4.4); trem.start(t); trem.stop(t+4.4);
  const o=a.createOscillator(),og=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(34,t); o.frequency.linearRampToValueAtTime(52,t+2.3); o.frequency.linearRampToValueAtTime(30,t+4);
  env(og,t,2,.35,.5,1.6); o.connect(og); og.connect(a.destination); o.start(t); o.stop(t+4.4);
  drum(a,t+2.3,46,.75); drum(a,t+3.1,40,.5);
}
function eventSound(name){
  if(!S.settings.events) return; const a=audio(); if(!a) return; const t=a.currentTime+.05;
  if(name==='block') themeBlock(a,t);
  if(name==='level'){ whoosh(a,t,.35); drone(a,t+.6,2.6,[73.4,110,146.8],.07); }
  if(name==='rank'){ if(THEME()==='spice'){ [0,.38,.76,1.14,1.6].forEach((d,i)=>drum(a,t+d,i===4?44:58,i===4?.85:.5)); drone(a,t+1.5,3.6,[55,82.5,110],.1); } else { themeBlock(a,t); themeFinale(a,t+1.1); } }
  if(name==='quake') themeFinale(a,t);
}
/* фоновый ветер */
let AMB=null;
function startAmbient(){
  if(AMB||!S.settings.ambient) return; const a=audio(); if(!a) return;
  const master=a.createGain(); master.gain.value=0.0001; master.connect(a.destination);
  AMB={master,parts:[],timers:[]}; const r=buildAmbient(a,master); AMB.parts=r.parts; AMB.timers=AMB.timers.concat(r.timers); setAmbientLevel(2.5);
}
function restartAmbient(){ if(!AMB) return; stopAmbient(); setTimeout(()=>{ if(S.settings.ambient) startAmbient(); },750); }
function ambTarget(){ return S.settings.ambient?(S.settings.ambVol||0)*0.22*(run?.45:1):0.0001; }
function setAmbientLevel(sec){ if(!AMB) return; const a=audio(), g=AMB.master.gain, t=a.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.0001,g.value),t); g.linearRampToValueAtTime(Math.max(0.0001,ambTarget()),t+(sec||.6)); }
function stopAmbient(){ if(!AMB) return; const x=AMB; AMB=null; (x.timers||[]).forEach(clearTimeout); const a=audio(),t=a.currentTime; x.master.gain.cancelScheduledValues(t); x.master.gain.setValueAtTime(x.master.gain.value,t); x.master.gain.linearRampToValueAtTime(0.0001,t+.6); setTimeout(()=>x.parts.forEach(p=>{try{p.stop();}catch(e){}}),800); }
document.addEventListener('visibilitychange',()=>{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); });

function tapSound(kind){
  if(!S.settings.taps) return; const a=audio(); if(!a) return; try{ tsnd().tap(a,a.currentTime+.005,kind==='tab'); }catch(e){}
}
function sfx(name,arg){ try{ if(['block','level','rank','quake'].includes(name)){ eventSound(name); if(name==='level'&&S.settings.sound) SFX.level(); return; } if(S.settings.sound) SFX[name](arg); }catch(e){} }
function buzz(ms){ if(!S.settings.vibe) return; try{ if(window.MentatNative&&MentatNative.vibrate) MentatNative.vibrate(ms); else if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------- сцены палитр: пустыня, море, оазис, закат ---------- */
const THEME=()=>S.settings.accent||'spice';
const CSSC={sky1:'var(--sky1)',sky2:'var(--sky2)',f1:'var(--dune1)',f2:'var(--dune2)',f3:'var(--dune3)',lt:'var(--ripple)',moon:'var(--moon)',sun:'var(--sun-c,var(--moon))'};
const OCHRE={light:{sky1:'#F4DDB0',sky2:'#EBC48A',dune1:'#DDB27A',dune2:'#CC9257',dune3:'#B5743F',ripple:'#E9C08A',moon:'#FFF8EA',ink:'#2B1C10'},
             dark:{sky1:'#2B2244',sky2:'#191325',dune1:'#40303F',dune2:'#2F2233',dune3:'#211827',ripple:'#4A3848',moon:'#F2E5CD',ink:'#F2E5CD'}};
const FINALE_NAME={spice:'Гул песков',water:'Прибой',oasis:'Родник',dusk:'Колокола'};
function hx(h){ h=String(h).replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mixc(a,b,t){ const A=hx(a),B=hx(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function wavePath(y,amp,len,x0,x1){ let d=`M${x0} 240 L${x0} ${y}`; for(let x=x0;x<x1;x+=len) d+=` Q${x+len/4} ${y-amp} ${x+len/2} ${y} T${x+len} ${y}`; return d+` L${x1} 240Z`; }
function palm(x,y,h,s,col,lean,i){
  const tx=x+lean, ty=y-h;
  let g=`<path d="M${x} ${y} Q${x+lean*0.15} ${y-h*0.55} ${tx} ${ty}" fill="none" style="stroke:${col}" stroke-width="${(5*s).toFixed(1)}" stroke-linecap="round"/>`;
  g+=`<g class="sway sw${i}" style="transform-origin:${tx}px ${ty}px">`;
  [-165,-128,-92,-58,-22,12,-200].forEach((a,k)=>{ const L=(k%2?30:38)*s;
    g+=`<path transform="translate(${tx} ${ty}) rotate(${a})" d="M0 0 Q${(L*0.5).toFixed(1)} ${(-L*0.34).toFixed(1)} ${L.toFixed(1)} ${(L*0.14).toFixed(1)} Q${(L*0.48).toFixed(1)} ${(-L*0.06).toFixed(1)} 0 0Z" style="fill:${col}"/>`; });
  return g+`<circle cx="${tx}" cy="${ty+2*s}" r="${(3.2*s).toFixed(1)}" style="fill:${col}"/></g>`;
}
/* o.night: undefined — день и ночь переключает CSS (шапка); true/false — нарисовать только нужное (главы пути) */
function scene(th,o){
  const C=o.C, id=o.id, N=o.night, day=N!==true, nit=N!==false, sunY=o.sunY==null?100:o.sunY;
  const dayCls=N===undefined?'class="sun"':'', nitCls=N===undefined?'class="moons"':'', starCls=N===undefined?'class="stars-sky"':'';
  let g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${C.sky1}"/><stop offset="1" style="stop-color:${C.sky2}"/></linearGradient>
    <mask id="${id}m"><rect width="400" height="240" fill="#fff"/><circle cx="309" cy="64" r="17" fill="#000"/></mask><clipPath id="${id}c"><circle cx="210" cy="150" r="54"/></clipPath></defs>
    <rect width="400" height="240" fill="url(#${id})"/>`;
  if(nit){ g+=`<g ${starCls} style="fill:${C.moon}">${[[40,30,1.2],[96,58,1],[150,22,1.4],[214,48,1],[262,18,1.2],[190,96,.9],[120,112,1.1],[70,140,.9],[384,40,1],[236,132,.8],[18,96,1],[345,120,.9]].map(([x,y,r])=>`<circle class="tw" cx="${x}" cy="${y}" r="${r}"/>`).join('')}
    <path class="shoot" d="M300 20 l14 -6" style="stroke:${C.moon}" stroke-width="1.4" stroke-linecap="round"/><path class="shoot s2" d="M200 30 l14 -6" style="stroke:${C.moon}" stroke-width="1.2" stroke-linecap="round"/></g>`; }
  if(th==='dusk'){
    if(day) g+=`<g ${dayCls}><circle class="glow" cx="210" cy="150" r="80" style="fill:${C.sun}" opacity=".25"/><circle cx="210" cy="150" r="54" style="fill:${C.sun}"/><g clip-path="url(#${id}c)">${[138,148,157,165].map((y,i)=>`<rect x="150" y="${y}" width="120" height="${2+i*1.6}" style="fill:${C.sky2}"/>`).join('')}</g></g>`;
    if(nit) g+=`<g ${nitCls}><circle cx="300" cy="70" r="19" style="fill:${C.moon}" mask="url(#${id}m)"/></g>`;
    g+=`<g class="flock" style="stroke:${C.f3}" fill="none" stroke-width="1.4" stroke-linecap="round">${[[150,52],[168,44],[182,56],[200,48],[164,64]].map(([x,y])=>`<path d="M${x} ${y} q4 -4 8 0 q4 -4 8 0"/>`).join('')}</g>
    <g class="d1"><path style="fill:${C.f1}" d="M-10 160 L30 142 L72 158 L120 120 L165 150 L214 128 L262 152 L312 114 L360 146 L410 128 V240 H-10Z"/></g>
    <g class="d2"><path style="fill:${C.f2}" d="M-10 184 L50 160 L105 180 L160 152 L220 178 L280 156 L340 182 L410 162 V240 H-10Z"/></g>
    <g class="d3"><path style="fill:${C.f3}" d="M-10 208 C60 194 120 198 200 206 S330 198 410 204 V240 H-10Z"/></g>`;
    return g;
  }
  if(day) g+=`<g ${dayCls}><g transform="translate(0 ${sunY-100})"><circle class="glow" cx="296" cy="100" r="46" style="fill:${C.sun}"/><circle cx="296" cy="100" r="30" style="fill:${C.sun}"/></g></g>`;
  if(nit) g+= th==='spice'
    ? `<g ${nitCls}><circle cx="326" cy="98" r="22" style="fill:${C.moon}" opacity=".92"/><circle cx="366" cy="128" r="8" style="fill:${C.moon}" opacity=".75"/></g>`
    : `<g ${nitCls}><circle cx="326" cy="96" r="20" style="fill:${C.moon}" opacity=".92"/></g>`;
  if(th==='water'){
    g+=`<path style="fill:${C.f3}" opacity=".45" d="M14 158 C34 146 62 143 92 158Z"/>
    <rect y="158" width="400" height="82" style="fill:${C.f1}"/>
    ${day?`<g ${dayCls}><g class="glints" style="fill:${C.moon}">${[[296,166,26],[300,176,20],[292,186,16],[298,196,11]].map(([x,y,w])=>`<ellipse class="gl" cx="${x}" cy="${y}" rx="${w}" ry="1.6" opacity=".6"/>`).join('')}</g>
      <g class="gulls" style="stroke:${C.f3}" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M190 62 q6 -6 12 0 q6 -6 12 0"/><path d="M222 50 q5 -5 10 0 q5 -5 10 0"/></g></g>`:''}
    ${nit?`<g ${nitCls}><g class="glints" style="fill:${C.moon}">${[[326,166,22],[330,177,16],[322,188,12]].map(([x,y,w])=>`<ellipse class="gl" cx="${x}" cy="${y}" rx="${w}" ry="1.4" opacity=".55"/>`).join('')}</g></g>`:''}
    <g class="boat"><path style="fill:${C.f3}" d="M104 168 L138 168 L131 175 L111 175Z"/><path d="M121 167 L121 136" style="stroke:${C.f3}" stroke-width="1.3"/><path style="fill:${C.moon}" opacity=".92" d="M122.5 138 L122.5 165 L138 165Z"/><path style="fill:${C.moon}" opacity=".75" d="M119.5 143 L119.5 165 L108 165Z"/></g>

function plip(a,t,f,v){ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.3,t+.06);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(0.0001,t+.14); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.17); }
function partials(a,t,f,v,d,list){ list.forEach(([m,k])=>{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=f*m; const dd=d/Math.pow(m,.55);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*k),t+.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dd); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dd+.05); }); }
const mallet=(a,t,f,v,d)=>partials(a,t,f,v,d||.5,[[1,1],[4,.16],[9.2,.04]]);
const bell=(a,t,f,v,d)=>partials(a,t,f,v,d||1.6,[[1,1],[2.76,.45],[5.4,.2],[8.93,.07]]);
function knock(a,t,f,v){ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.7,t+.05);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.07); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.09);
  const n=noiseSrc(a),bp=a.createBiquadFilter(),ng=a.createGain(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=2; ng.gain.setValueAtTime(v*.6,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+.025);
  n.connect(bp); bp.connect(ng); ng.connect(a.destination); n.start(t); n.stop(t+.04); }
function chirp(a,t,v){ [0,.13,.26].slice(0,2+Math.floor(Math.random()*2)).forEach(d=>{ const o=a.createOscillator(),g=a.createGain(),f=2400+Math.random()*700; o.type='sine';
  o.frequency.setValueAtTime(f,t+d); o.frequency.exponentialRampToValueAtTime(f*1.45,t+d+.05); o.frequency.exponentialRampToValueAtTime(f*.9,t+d+.1);
  g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(v,t+d+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d+.11); o.connect(g); g.connect(a.destination); o.start(t+d); o.stop(t+d+.13); }); }
function swell(a,t,dur,v){ const n=noiseSrc(a),lp=a.createBiquadFilter(),g=a.createGain(); lp.type='lowpass';
  lp.frequency.setValueAtTime(160,t); lp.frequency.exponentialRampToValueAtTime(2600,t+dur*.45); lp.frequency.exponentialRampToValueAtTime(260,t+dur);
  env(g,t,dur*.45,v,.1,dur*.5); n.connect(lp); lp.connect(g); g.connect(a.destination); n.start(t); n.stop(t+dur+.2); }
const PENT=[523,587,659,784,880,1047,1175,1319];
const TSND={

      g.gain.setValueAtTime(tab?.16:.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.1); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.12);
      const n=noiseSrc(a),bp=a.createBiquadFilter(),ng=a.createGain(); bp.type='bandpass'; bp.frequency.value=tab?1400:2600; bp.Q.value=1.4;

function themeFinale(a,t){ const th=THEME();

/* фон палитры: ветер, прибой, родник с птицами, вечерние сверчки */
function buildAmbient(a,master){
  const th=THEME(), parts=[], timers=[];
  const lfo=(f,depth,target)=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; g.gain.value=depth; o.connect(g); g.connect(target); parts.push(o); return o; };
  if(th==='water'){
    const n=noiseSrc(a),lp=a.createBiquadFilter(),wg=a.createGain(); lp.type='lowpass'; lp.frequency.value=650; wg.gain.value=.6;
    lfo(.09,.45,wg.gain); lfo(.09,380,lp.frequency); n.connect(lp); lp.connect(wg); wg.connect(master); parts.push(n);
    const n2=noiseSrc(a),hp=a.createBiquadFilter(),hg=a.createGain(); hp.type='highpass'; hp.frequency.value=3200; hg.gain.value=.05; lfo(.09,.04,hg.gain); n2.connect(hp); hp.connect(hg); hg.connect(master); parts.push(n2);
  } else if(th==='oasis'){
    const n=noiseSrc(a),bp=a.createBiquadFilter(),wg=a.createGain(); bp.type='bandpass'; bp.frequency.value=2300; bp.Q.value=2.6; wg.gain.value=.5;
    lfo(.7,700,bp.frequency); lfo(3.1,.18,wg.gain); n.connect(bp); bp.connect(wg); wg.connect(master); parts.push(n);
    const n2=noiseSrc(a),b2=a.createBiquadFilter(),g2=a.createGain(); b2.type='bandpass'; b2.frequency.value=800; g2.gain.value=.25; lfo(.12,.2,g2.gain); n2.connect(b2); b2.connect(g2); g2.connect(master); parts.push(n2);
    const bird=()=>{ if(!AMB||!S.settings.ambient) return; const v=Math.max(.004,(S.settings.ambVol||0)*.05*(run?.4:1)); chirp(a,a.currentTime+.05,v); AMB&&AMB.timers.push(setTimeout(bird,4000+Math.random()*7000)); };
    timers.push(setTimeout(bird,2500));
  } else if(th==='dusk'){
    const o=a.createOscillator(); o.frequency.value=4300; const g1=a.createGain(); g1.gain.value=0; const g2=a.createGain(); g2.gain.value=0;
    lfo(26,.5,g1.gain).type='square'; lfo(1.3,.5,g2.gain).type='square';
    const out=a.createGain(); out.gain.value=.05; o.connect(g1); g1.connect(g2); g2.connect(out); out.connect(master); parts.push(o);
    [110,164.8,220].forEach((f,i)=>{ const p=a.createOscillator(),pg=a.createGain(); p.frequency.value=f; p.detune.value=i*5; pg.gain.value=.05; p.connect(pg); pg.connect(master); parts.push(p); });
  } else {
    const n=noiseSrc(a),bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=.8;
    lfo(.06,320,bp.frequency); const wg=a.createGain(); wg.gain.value=.55; lfo(.11,.3,wg.gain);
    n.connect(bp); bp.connect(wg); wg.connect(master); parts.push(n);
    const n2=noiseSrc(a),lp=a.createBiquadFilter(),lg=a.createGain(); lp.type='lowpass'; lp.frequency.value=110; lg.gain.value=.5; n2.connect(lp); lp.connect(lg); lg.connect(master); parts.push(n2);
  }
  parts.forEach(p=>{ try{ p.start(); }catch(e){} });
  return {parts,timers};
}

const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function wheel(start,steps,sub){
  const pts=WD.map((d,i)=>{ const an=(-90+i*360/7)*Math.PI/180; return [80+Math.cos(an)*58,80+Math.sin(an)*58,d]; });
  return `<div class="wheelbox"><svg class="wheel" viewBox="0 0 160 160" data-start="${start}" data-steps="${steps}">
    <circle cx="80" cy="80" r="70" class="wr"/>${pts.map(([x,y,d],i)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" class="wd" data-i="${i}"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" class="wt" data-i="${i}">${d}</text>`).join('')}
    <g class="hand" style="transform:rotate(${start*360/7}deg)"><line x1="80" y1="80" x2="80" y2="36"/><circle cx="80" cy="80" r="5"/></g></svg>${sub?`<div class="wsub">${sub}</div>`:''}</div>`;
}
function spinWheel(st){
  const w=st.querySelector('.wheel'); if(!w) return;
  const s=+w.dataset.start, n=+w.dataset.steps, hand=w.querySelector('.hand'), end=(s+n)%7;
  const mark=i=>{ w.querySelectorAll('.wd').forEach(c=>c.classList.toggle('on',+c.dataset.i===i)); };
  mark(s);
  if(!n) return;
  const dur=Math.min(2.6,.35+n*.11);
  setTimeout(()=>{ hand.style.transition=`transform ${dur}s cubic-bezier(.3,.1,.2,1)`; hand.style.transform=`rotate(${(s+n)*360/7}deg)`; },350);
  setTimeout(()=>mark(end),350+dur*1000);
}

function niceMax(v){ if(v<=0) return 1; const p=10**Math.floor(Math.log10(v)),n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function lineChart(series,o){
  const W=340,H=o.h||170,L=36,R=10,T=10,B=o.xl?22:8,iw=W-L-R,ih=H-T-B;
  const n=Math.max(...series.map(s=>s.vals.length));
  const X=i=>L+(n<=1?iw/2:i/(n-1)*iw), Y=v=>T+ih-(v-o.min)/(o.max-o.min)*ih;
  let g='';
  o.ticks.forEach(t=>{ const y=Y(t).toFixed(1); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${o.fmt?o.fmt(t):t}</text>`; });
  if(o.xl) o.xl.forEach(([i,txt])=>{ g+=`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${n<=1?'middle':i===0?'start':i===n-1?'end':'middle'}">${txt}</text>`; });
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean); if(!pts.length) return;
    const d=s.step? pts.map((p,i)=>i?`H${p[0].toFixed(1)}V${p[1].toFixed(1)}`:`M${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('')
                  : pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
    if(s.area&&pts.length>1) g+=`<path class="a${s.c}" d="${d}L${pts[pts.length-1][0].toFixed(1)},${T+ih}L${pts[0][0].toFixed(1)},${T+ih}Z"/>`;
    g+=`<path class="s${s.c}" d="${d}"/>`;
    const e=pts[pts.length-1]; g+=`<circle class="d${s.c}" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'График'}">${g}</svg>`;
}
function barChart(vals,labels){
  const W=340,H=150,L=30,R=6,T=10,B=22,iw=W-L-R,ih=H-T-B,mx=niceMax(Math.max(...vals,1)),bw=iw/vals.length;
  let g=''; [0,mx/2,mx].forEach(t=>{const y=(T+ih-t/mx*ih).toFixed(1); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-5}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;});
  vals.forEach((v,i)=>{ const h=Math.max(v/mx*ih,2),x=L+i*bw+bw*.18;
    g+=`<rect class="${v?'bar':'bar0'}" x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${v} мин</title></rect>`;
    if(labels[i]) g+=`<text x="${(x+bw*.32).toFixed(1)}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Минуты по дням">${g}</svg>`;
}
function heatmap(minsByDay){
  const weeks=14,cs=19,gap=3,L=22,T=4,W=L+weeks*(cs+gap),H=T+7*(cs+gap)+14;
  const today=new Date(); today.setHours(0,0,0,0);
  const dw=(today.getDay()+6)%7, start=new Date(today); start.setDate(start.getDate()-dw-(weeks-1)*7);
  let g=''; ['Пн','','Ср','','Пт','','Вс'].forEach((t,i)=>{ if(t) g+=`<text x="0" y="${T+i*(cs+gap)+cs-5}">${t}</text>`; });
  let lastMon=-1,lastX=-99;
  for(let w=0;w<weeks;w++) for(let d=0;d<7;d++){
    const day=new Date(start); day.setDate(start.getDate()+w*7+d); if(day>today) continue;
    const m=minsByDay[dayKey(day)]||0, x=L+w*(cs+gap), y=T+d*(cs+gap);
    const op=m<5?.35:m<10?.6:m<20?.82:1;
    g+= m? `<rect class="hm" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="4" opacity="${op}"><title>${day.getDate()} ${MON[day.getMonth()]}: ${Math.round(m)} мин</title></rect>` : `<rect class="hm0" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="4"/>`;
    if(d===0&&day.getMonth()!==lastMon){ lastMon=day.getMonth(); if(w<weeks-1&&x-lastX>=36){ lastX=x; g+=`<text x="${x}" y="${H-2}">${MON[lastMon].slice(0,3)}</text>`; } }
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Календарь тренировок">${g}</svg>`;
}
function radar(){
  const ids=Object.keys(MODS),W=340,H=290,cx=170,cy=145,R=100,n=ids.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  const P=p=>p.map(v=>v.toFixed(1)).join(',');
  let g='';
  [.25,.5,.75,1].forEach(f=>{ g+=`<polygon class="rgrid" points="${ids.map((_,i)=>P(pt(i,R*f))).join(' ')}"/>`; });
  ids.forEach((id,i)=>{ const [x,y]=pt(i,R); g+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,R+18); g+=`<text class="rlabel" x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${Math.abs(lx-cx)<8?'middle':lx<cx?'end':'start'}">${MODS[id].short}</text>`; });
  const vals=ids.map(id=>Math.max(.04,(lv(id)-1)/(MODS[id].levels.length-1)));
  g+=`<polygon class="radar" points="${vals.map((v,i)=>P(pt(i,R*v))).join(' ')}"/>`;
  vals.forEach((v,i)=>{const [x,y]=pt(i,R*v); g+=`<circle class="dA" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Профиль навыков">${g}</svg>`;
}

function weakList(){

  const days=[...new Set(S.blocks.map(b=>{const d=new Date(b.t);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>a-b);
  let best=0,cur=0,prev=null;
  days.forEach(t=>{ cur=(prev!==null&&Math.round((t-prev)/86400000)===1)?cur+1:1; best=Math.max(best,cur); prev=t; });

}

    const tC=tvals.some(v=>v!=null)?lineChart([{vals:tvals,c:'C'}],{min:0,max:tmax,ticks:[0,tmax/2,tmax],fmt:t=>String(Math.round(t*10)/10).replace('.',','),xl,h:130,label:'Секунд на ответ'}):'';
    const all=S.blocks.filter(b=>b.mod===progMod), tot=all.reduce((s,b)=>s+b.total,0), cor=all.reduce((s,b)=>s+b.correct,0);
    const best=Math.max(...all.map(r=>r.total?r.correct/r.total:0)), bestCombo=Math.max(0,...all.map(r=>r.maxCombo||0));
    const fast=all.filter(r=>r.avgMs).map(r=>r.avgMs), fastest=fast.length?Math.min(...fast):0;
    modCard=`<div class="modchips">${withData.map(id=>`<button data-pm="${id}" aria-pressed="${id===progMod}">${MODS[id].name}</button>`).join('')}</div>
      <div class="card"><div class="ct"><b>Точность</b><span class="muted small">последние ${n} ${plural(n,['блок','блока','блоков'])}</span></div>${accC}</div>
      <div class="card"><div class="ct"><b>Уровень</b><span class="muted small">сейчас ${lv(progMod)} из ${max}</span></div>${lvC}</div>
      ${tC?`<div class="card"><div class="ct"><b>Скорость</b><span class="muted small">секунд на ответ, меньше лучше</span></div>${tC}</div>`:''}
      <div class="card"><ul class="recs">
        <li><span>Блоков</span><b>${all.length}</b></li>
        <li><span>Решено заданий</span><b>${fmt(tot)}</b></li>
        <li><span>Средняя точность</span><b>${tot?Math.round(cor/tot*100):0}%</b></li>
        <li><span>Лучший блок</span><b>${Math.round(best*100)}%</b></li>
        <li><span>Рекордная серия</span><b>${bestCombo}</b></li>
        ${fastest?`<li><span>Лучшая скорость</span><b>${sec1(fastest)} с</b></li>`:''}
      </ul></div>`;
  }
  const sess=S.sessions.slice(-30);
  const sessC=sess.length>=2?lineChart([{vals:sess.map(s=>s.total?Math.round(s.correct/s.total*100):0),c:'A',area:true}],{min:0,max:100,ticks:[0,50,100],fmt:t=>t+'%',h:120,xl:[[0,'первая'],[sess.length-1,'последняя']],label:'Точность по тренировкам'}):'';
  return `<div class="page"><h1>Прогресс</h1>
    <div class="kpis4">
      <div>${rk.title}<small>ранг, пройдено ${Math.round(rk.m*100)}% пути</small></div>
      <div>${st}<small>${plural(st,['день','дня','дней'])} подряд, рекорд ${bestStreak()}</small></div>
      <div>${mins}<small>минут тренировок</small></div>
      <div>${solved?Math.round(right/solved*100):0}%<small>точность, ${fmt(solved)} заданий</small></div>
    </div>
    <h3>Лестница рангов</h3>
    <div class="card"><div class="ladder">${RANKS.map((r,i)=>`<div class="${i<rk.idx?'':i===rk.idx?'cur':'off'}">${emblem(i)}<span>${r[1]}</span></div>`).join('')}</div></div>
    <h3>Профиль навыков</h3>
    <div class="card">${radar()}<p class="muted small">Чем дальше точка от центра, тем выше уровень навыка.</p></div>
    <h3>Активность</h3>
    <div class="card"><div class="ct"><b>Календарь</b><span class="muted small">14 недель</span></div>${heatmap(byDay)}</div>
    <div class="card"><div class="ct"><b>Минуты по дням</b><span class="muted small">2 недели</span></div>${barChart(days,labels)}</div>
    ${sessC?`<div class="card"><div class="ct"><b>Точность тренировок</b><span class="muted small">${sess.length} последних</span></div>${sessC}</div>`:''}
    <h3>По навыкам</h3>
    ${modCard||`<p class="empty">Графики по навыкам появятся после первой тренировки.</p>`}
    </div>`;
}

/* ---------- движок тренировки ---------- */
let run=null, blk=null, task=null, gen=0, timerId=null, pendingCont=null, prevTab='home';
const lvDef=()=>modOf(blk.id).levels[blk.level-1];

function startSession(queue,mode){
  audio();
  run={queue:queue.map(q=>({...q})),idx:0,results:[],mode,t0:Date.now()};
  document.body.classList.add('running');
  setAmbientLevel(1.2);
  showIntro();
}

function resLine(r){
  const ch=r.newLevel>r.level?`<span class="up">уровень ${r.newLevel}</span>`:r.newLevel<r.level?`<span class="down">уровень ${r.newLevel}</span>`:`уровень ${r.level}`;
  return `<span>${modOf(r.mod).name}: ${r.correct} из ${r.total}, ${ch}</span>${starsHTML(starsOf(r))}`;
}

function showIntro(){
  const b=run.queue[run.idx],m=modOf(b.id),l=b.level||lv(b.id),n=run.queue.length,last=run.results[run.results.length-1];
  $('#view').innerHTML=`<div class="interlude">
    ${last?`<div class="lastres">${resLine(last)}</div>`:''}
    ${n>1?`<div class="step">Блок ${run.idx+1} из ${n}</div>`:''}
    <div class="dhead"><span class="glyph">${m.glyph}</span><h1>${m.name}</h1></div>
    <p class="lvlabel">Уровень ${l} из ${m.levels.length}: ${m.levels[l-1].label}. ${b.sec/60} мин.</p>
    ${DEMOS[b.id]?(((S.demoSeen||{})[b.id]||0)<3?demoHTML(b.id,true):`<button class="pill" data-a="showdemo" data-id="${b.id}">Как решать ▸</button><div id="demoslot"></div>`):''}
    ${SHORT[b.id]?shortHTML(b.id):`<p class="tip">${m.tip}</p>`}
    <button class="primary" data-a="go">Начать блок</button>
    <button class="ghost" data-a="quit">Завершить тренировку</button></div>`;
  window.scrollTo(0,0);
  if(DEMOS[b.id]&&((S.demoSeen||{})[b.id]||0)<3){ S.demoSeen=S.demoSeen||{}; S.demoSeen[b.id]=(S.demoSeen[b.id]||0)+1; save(); }
  setTimeout(runDemos,40);
}

function startBlock(){
  const b=run.queue[run.idx],l=b.level||lv(b.id),m=modOf(b.id);
  blk={id:b.id,fixed:!!b.level,level:l,sec:b.sec,correct:0,total:0,times:[],combo:0,maxCombo:0,marks:[],start:Date.now(),ends:Date.now()+b.sec*1000,expired:false};
  task=null; gen++;
  $('#view').innerHTML=`<div class="run">
    <div class="runhead"><button class="ghost pausebtn" data-a="pause" aria-label="Пауза"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>Пауза</button>
      <div class="runtitle">${m.name}<span>${b.id==='daily'?'10 заданий, одинаковых для всех':`Уровень ${l}: ${m.levels[l-1].label}`}</span></div>
      <div class="score" aria-label="Верно из решённых"><span id="score">0/0</span></div></div>
    <div class="hgrow"><svg class="hg flip" viewBox="0 0 40 60" aria-hidden="true">
      <defs><clipPath id="hgc"><path d="M9 6H31C31 19 22.5 24 22.5 30C22.5 36 31 41 31 54H9C9 41 17.5 36 17.5 30C17.5 24 9 19 9 6Z"/></clipPath></defs>
      <g clip-path="url(#hgc)"><rect id="hgt" class="hgs" x="0" width="40" y="6" height="24"/><rect id="hgb" class="hgs" x="0" width="40" y="54" height="0"/><rect id="hgf" class="hgs hgflow" x="19.3" width="1.4" y="30" height="24"/></g>
      <path class="hgglass" d="M9 6H31C31 19 22.5 24 22.5 30C22.5 36 31 41 31 54H9C9 41 17.5 36 17.5 30C17.5 24 9 19 9 6Z"/>
      <rect class="hgcap" x="5" y="2" width="30" height="4" rx="2"/><rect class="hgcap" x="5" y="54" width="30" height="4" rx="2"/></svg>
      <span id="tleft" class="tl"></span><span id="tnote"></span><span class="combo" id="combo"></span></div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="controls" id="controls"></div></div>`;
  clearInterval(timerId); timerId=setInterval(tick,100); tick();
  nextTask();
}

function tick(){
  if(!blk||blk.paused) return;
  const left=Math.max(0,blk.ends-Date.now());
  const fr=left/(blk.sec*1000), ht=$('#hgt');
  if(ht){ const h=Math.max(0,22*fr), hb=Math.max(0,21*(1-fr)); ht.setAttribute('y',(30-h).toFixed(2)); ht.setAttribute('height',h.toFixed(2));
    const bb=$('#hgb'); bb.setAttribute('y',(54-hb).toFixed(2)); bb.setAttribute('height',hb.toFixed(2));
    const f=$('#hgf'); f.setAttribute('height',fr>0.003?(24-hb).toFixed(2):'0'); }
  const tl=$('#tleft'); if(tl) tl.textContent=fmtClock(left);
  if(left<=0&&!blk.expired){
    blk.expired=true;
    const k=modOf(blk.id).kind;
    if((k==='calc'||k==='approx'||k==='dow'||k==='daily')&&!(task&&task.locked)) finishBlock();
    else { const n=$('#tnote'); if(n) n.textContent='Время вышло'; }
  }
}

function nextTask(){
  if(!blk) return;
  if(blk.expired){ finishBlock(); return; }
  const k=modOf(blk.id).kind,my=gen;
  task={input:'',locked:false,accepting:false,t0:Date.now()};
  if(k==='calc'||k==='approx'){ Object.assign(task,lvDef().gen()); showCalc(); }
  else if(k==='dow') showDow();
  else if(k==='flash') runFlash(my);
  else if(k==='recall') runRecall(my);
  else if(k==='span') runSpan(my);
  else if(k==='kim') runKim(my);
  else if(k==='daily') runDaily();
}

function padHTML(comma){
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('');
  return `<div class="pad">${keys}<button data-k="back" aria-label="Стереть">⌫</button><button data-k="0">0</button><button data-k="ok" class="okk" aria-label="Ответить">✓</button>
    ${comma?`<button data-k=",">,</button><button data-k="skip" class="skip">Пропустить</button>`:`<button data-k="skip" class="skip wide3">Пропустить</button>`}</div>`;
}

function showCalc(){
  const tol=task.tol!=null?`<div class="hint">Допуск ±${Math.round(task.tol*100)}%</div>`:'';
  $('#stage').innerHTML=`<div class="q" id="qq">${task.q}</div><div class="ans empty" id="ans">?</div>${tol}<div class="fb" id="fb"></div>`;
  $('#controls').innerHTML=padHTML(task.tol!=null);
  sandIn();
  task.accepting=true; task.t0=Date.now();
}

function inputPhase(title,group,max){
  task.group=group; task.max=max; task.phase='input';
  $('#stage').innerHTML=`<div class="q small" id="qq">${title}</div><div class="ans empty ${group?'dig':''}" id="ans">?</div><div class="fb" id="fb"></div>`;
  $('#controls').innerHTML=padHTML(false);
  task.accepting=true; task.t0=Date.now();
}

function updAns(){
  const el=$('#ans'); if(!el) return;
  const t=task.input;
  el.textContent=t?(task.group?groupDigits(t):t):'?';
  el.classList.toggle('empty',!t);
}

function press(k){
  if(!task||!task.accepting) return;
  if(k==='ok'){ if(task.input) submit(false); return; }
  if(k==='skip'){ submit(true); return; }
  if(k==='back') task.input=task.input.slice(0,-1);
  else if(k===','){ if(!task.input.includes(',')) task.input=(task.input||'0')+','; }
  else if(task.input.length<(task.max||12)) task.input+=k;
  updAns();
}

function submit(skip){
  const k=task.type||modOf(blk.id).kind,raw=task.input;
  if(k==='recall'||k==='span'){
    const ok=!skip&&raw===task.a;
    return resolve(ok,`Правильно: ${groupDigits(task.a)}`,ok?650:2200);
  }
  const val=skip?NaN:parseFloat(raw.replace(',','.'));
  if(k==='approx'){
    const ok=Math.abs(val-task.a)<=task.tol*Math.abs(task.a);
    return resolve(ok,`Точно: ${fmtDec(task.a)}`,ok?900:1700,`Точно: ${fmtDec(task.a)}`);
  }
  resolve(val===task.a,`Правильно: ${fmt(task.a)}`);
}

const PRAISE=['Верно','Точно','Отлично','Так держать','Чисто'];
function burst(el){
  if(!el||reduced()) return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<34;i++){
    const s=document.createElement('i'); s.className='grain'+(i%5===0?' g2':i%7===0?' g3':'');
    const a=Math.random()*Math.PI*2,d=50+Math.random()*90;
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-20).toFixed(0)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}
function feedback(ok,text){
  const fb=$('#fb');
  if(fb){ fb.className='fb '+(ok?'ok':'no'); fb.textContent=text; void fb.offsetWidth; fb.classList.add('pop'); }
  const a=$('#ans'); if(a) a.classList.add(ok?'ok':'no');
  const combo=$('#combo');
  if(ok){
    burst(a||$('#qq')||$('#stage'));
    const sc=document.querySelector('.score'); if(sc&&!reduced()){ const p=document.createElement('span'); p.className='plus'; p.textContent='+1'; sc.appendChild(p); setTimeout(()=>p.remove(),900); }
    if(combo&&blk.combo>=3){ combo.textContent=`Серия ×${blk.combo}`; combo.classList.add('on'); combo.classList.remove('bump'); void combo.offsetWidth; combo.classList.add('bump'); }
    sfx('ok',blk.combo); buzz(18);
  }else{
    const q=$('#qq')||$('#stage'); if(q){ q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake'); }
    if(combo) combo.classList.remove('on');
    sfx('bad'); buzz(90);
  }
}


function sandAway(els){
  if(reduced()||!S.settings.sand) return false;
  let any=false;
  els.filter(Boolean).forEach(el=>{
    const r=el.getBoundingClientRect(); if(!r.width) return; any=true;
    const n=Math.min(260,Math.round(r.width*r.height/70));
    for(let i=0;i<n;i++){
      const g=document.createElement('i'); g.className='sgrain'+(i%4===0?' sp':''); const sz=(1.5+Math.random()*2.8).toFixed(1); g.style.width=sz+'px'; g.style.height=sz+'px';
      const fx=Math.random(), x=r.left+fx*r.width, y=r.top+r.height*(.15+Math.random()*.7);
      g.style.left=x+'px'; g.style.top=y+'px';
      const th=THEME();
      const dx=th==='water'?(-30+Math.random()*60):th==='dusk'?(10+Math.random()*90):(40+Math.random()*170);
      const dy=th==='water'?(-70-Math.random()*110):th==='dusk'?(-50-Math.random()*90):th==='oasis'?(-10+Math.random()*70):(-30+Math.random()*44);
      g.style.setProperty('--dx',dx.toFixed(0)+'px'); g.style.setProperty('--dy',dy.toFixed(0)+'px');
      g.style.animationDelay=(fx*300).toFixed(0)+'ms';
      document.body.appendChild(g); setTimeout(()=>g.remove(),1200);
    }
    el.classList.add('sweep');
  });
  return any;
}
function sandIn(){ if(reduced()||!S.settings.sand||!blk||!blk.total) return; ['#qq','#ans'].forEach(q=>{const e=$(q); if(e) e.classList.add('sandin');}); }

function resolve(ok,shown,delay,okText){
  task.locked=true; task.accepting=false;
  blk.total++;
  blk.marks.push(ok);
  if(ok){ blk.correct++; blk.combo++; blk.maxCombo=Math.max(blk.maxCombo,blk.combo); } else blk.combo=0;
  blk.times.push(Date.now()-task.t0);
  const sc=$('#score'); if(sc) sc.textContent=`${blk.correct}/${blk.total}`;
  feedback(ok, ok?(okText||(blk.combo>=5?`${pick(PRAISE)}! Серия ${blk.combo}`:pick(PRAISE))):shown);
  const my=gen;
  const k=modOf(blk.id).kind, sandable=ok&&(k==='calc'||k==='approx'||k==='dow'||k==='daily')&&S.settings.sand&&!reduced();
  if(sandable){
    setTimeout(()=>{ if(my===gen) sandAway([$('#qq'),$('#ans'),$('#fb')]); },Math.max(180,(delay??420)-260));
    setTimeout(()=>{ if(my===gen) nextTask(); },(delay??420)+300);
  } else setTimeout(()=>{ if(my===gen) nextTask(); },delay??(ok?420:1400));
}

/* день недели */
function showDow(fx){
  const L=fx?null:lvDef(),y=fx?fx.y:rnd(L.from,L.to),mo=fx?fx.mo:rnd(0,11);
  const dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate(),d=fx?fx.d:rnd(1,dim);
  task.a=(new Date(Date.UTC(y,mo,d)).getUTCDay()+6)%7;
  $('#stage').innerHTML=`<div class="q dateq" id="qq">${d} ${MON[mo]} ${y}</div><div class="fb" id="fb"></div>`;
  $('#controls').innerHTML=`<div class="dows">${DOW.map((x,i)=>`<button data-dow="${i}">${x}</button>`).join('')}<button data-dow="skip" class="skipd">Пропустить</button></div>`;
  sandIn();
  task.dowOpen=true; task.t0=Date.now();
}
function answerDow(v){
  if(!task||task.locked||!task.dowOpen) return;
  const b=document.querySelector(`[data-dow="${task.a}"]`); if(b) b.classList.add('right');
  if(v!==task.a&&v>=0){ const w=document.querySelector(`[data-dow="${v}"]`); if(w) w.classList.add('wrongb'); }
  resolve(v===task.a,`Это ${DOWF[task.a]}`);
}

/* флеш-счёт */
function runFlash(my){
  const L=lvDef(),nums=Array.from({length:L.n},()=>nd(L.d));
  task.a=nums.reduce((s,x)=>s+x,0);
  $('#controls').innerHTML='';
  $('#stage').innerHTML=`<div class="q flash" id="fl"></div><div class="hint">Складывай про себя</div>`;
  let i=0;
  const step=()=>{
    if(my!==gen) return;
    const el=$('#fl'); if(!el) return;
    if(i>=nums.length){ inputPhase(`Сумма ${L.n} чисел`,false,8); return; }
    el.textContent='';
    setTimeout(()=>{ if(my!==gen) return; el.textContent=fmt(nums[i++]); setTimeout(step,L.ms); },180);
  };
  setTimeout(step,700);
}

/* фаза запоминания */
function studyLoop(my,end){
  const loop=()=>{
    if(my!==gen||!task||task.phase!=='study') return;
    const left=end-Date.now();
    if(left<=0){ studied(); return; }
    const cd=$('#cd'); if(cd) cd.textContent=Math.ceil(left/1000)+' с';
    setTimeout(loop,200);
  };
  loop();
}
function studied(){
  if(!task||task.phase!=='study') return;
  const k=modOf(blk.id).kind;
  if(k==='recall') inputPhase(`Введи ${task.a.length} ${plural(task.a.length,['цифру','цифры','цифр'])}`,true,task.a.length);
  else if(k==='kim') kimPick();
}

function runRecall(my){
  const L=lvDef(),s=Array.from({length:L.n},()=>rnd(0,9)).join('');
  task.a=s; task.phase='study';
  $('#stage').innerHTML=`<div class="digits">${groupDigits(s)}</div><div class="hint">Запоминай. Осталось <span id="cd"></span></div>`;
  $('#controls').innerHTML=`<button class="primary" data-a="studied">Запомнил</button>`;
  studyLoop(my,Date.now()+L.n*1000+3000);
}

function runSpan(my){
  const L=lvDef(),ds=Array.from({length:L.n},()=>rnd(0,9));
  task.a=ds.slice().reverse().join('');
  $('#controls').innerHTML='';
  $('#stage').innerHTML=`<div class="q flash" id="fl"></div><div class="hint">Запоминай по одной цифре. Вводить нужно с конца.</div>`;
  let i=0;
  const step=()=>{
    if(my!==gen) return;
    const el=$('#fl'); if(!el) return;
    if(i>=ds.length){ inputPhase('Введи цифры в обратном порядке',true,ds.length); return; }
    el.textContent='';
    setTimeout(()=>{ if(my!==gen) return; el.textContent=ds[i++]; setTimeout(step,800); },200);
  };
  setTimeout(step,700);
}

function runKim(my){
  const L=lvDef(),pool=shuffle(EMOJI),pres=pool.slice(0,L.k),dis=pool.slice(L.k,L.k*2);
  task.present=new Set(pres); task.options=shuffle(pres.concat(dis)); task.sel=new Set(); task.phase='study';
  $('#stage').innerHTML=`<div class="kgrid">${pres.map(e=>`<span>${e}</span>`).join('')}</div><div class="hint">Запоминай предметы. Осталось <span id="cd"></span></div>`;
  $('#controls').innerHTML=`<button class="primary" data-a="studied">Запомнил</button>`;
  studyLoop(my,Date.now()+L.ms);
}
function kimPick(){
  task.phase='input';
  const n=task.options.length,cols=n<=12?4:n<=20?5:6;
  $('#stage').innerHTML=`<div class="q small" id="qq">Отметь всё, что было</div>
    <div class="kgrid ${cols>4?'dense':''}" style="grid-template-columns:repeat(${cols},1fr)">${task.options.map((e,i)=>`<button data-kim="${i}" aria-pressed="false">${e}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  $('#controls').innerHTML=`<button class="primary" data-a="kimdone">Проверить</button>`;
  task.t0=Date.now();
}
function toggleKim(i,btn){
  if(!task||task.locked||task.phase!=='input') return;
  if(task.sel.has(i)){ task.sel.delete(i); btn.setAttribute('aria-pressed','false'); }
  else { task.sel.add(i); btn.setAttribute('aria-pressed','true'); }
}
function kimDone(){
  if(!task||task.locked||task.phase!=='input'||!task.present) return;
  let hit=0,extra=0;
  task.options.forEach((e,i)=>{
    const b=document.querySelector(`[data-kim="${i}"]`),was=task.present.has(e),s=task.sel.has(i);
